# Single prefork worker, no keep-alive: every request gets a fresh child
# from the same parent, so fork-inherited mappings stay stable.
KeepAlive Off

<IfModule mpm_prefork_module>
    StartServers           1
    MinSpareServers        1
    MaxSpareServers        1
    MaxRequestWorkers      1
    ServerLimit            1
    MaxConnectionsPerChild 0
</IfModule>
