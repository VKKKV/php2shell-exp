; php2shell-exp: 8.5.11 target settings, mirroring the dinosn lab.ini
; (pinned image php@sha256:974e3a920309...). Keep in sync with the profile.
memory_limit=16M
post_max_size=32M
upload_max_filesize=32M
max_input_nesting_level=64
session.upload_progress.enabled=1
session.upload_progress.cleanup=1
session.save_path=/tmp
expose_php=0
display_errors=1
display_startup_errors=1
log_errors=1
error_log=/proc/self/fd/2
allow_url_fopen=0
allow_url_include=0
disable_functions=exec,system,shell_exec,passthru,proc_open,popen,pcntl_exec,dl
